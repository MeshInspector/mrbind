# Scratch workflow (not for merging): builds mrbind, the C test bindings and the Python bindings over them, runs the smoke test.
name: Test Python over C

on:
  push:
    branches: [python-generator-ci-test]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Install Clang 22
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 22
          sudo apt-get install -y libclang-22-dev llvm-22-dev clang-tools-22 ninja-build python3-dev
      - name: Build mrbind
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER=clang++-22 -DCMAKE_C_COMPILER=clang-22 -DClang_DIR=/usr/lib/cmake/clang-22
          ninja -C build mrbind mrbind_gen_c mrbind_gen_python
      - name: C test bindings
        run: bash test/make_c.sh
      - name: Python over C
        run: bash test/make_python_c.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-c-outputs
          path: |
            test/output_python_c
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c-outputs
          path: |
            test/output_c
            test/output_c_fixed_typedefs
            test/output_c_fixed_typedefs_64_only
